name: roben-ridepool

services:
  # ---------------------------------------------------------------- database
  postgres:
    image: postgres:16-alpine
    container_name: robenridepool-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-robenridepool}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-robenridepool}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ------------------------------------------------------------------ backend
  backend:
    build:
      context: ./backend
    container_name: robenridepool-backend
    restart: unless-stopped
    depends_on:
      postgres:
        # Only start the API once PostgreSQL actually accepts connections.
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      # Inside the compose network the database is reachable as `postgres`.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-robenridepool}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-change_me}
    ports:
      - "${BACKEND_PORT:-5000}:5000"

  # ----------------------------------------------------------------- frontend
  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* values are compiled into the bundle, so they must be
        # available at build time as well as at runtime.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    container_name: robenridepool-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  postgres-data:
